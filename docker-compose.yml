# Запуск:  docker compose up -d      Открыть:  http://localhost:5174
# Остановка: docker compose down     (данные в томе graphy-data сохраняются)
services:
  graphy:
    image: graphy:latest
    build: .
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      SEARXNG_URL: http://searxng:8080
    volumes:
      - graphy-data:/data
      - graphy-workspace:/workspace
    tmpfs:
      - /tmp:rw,exec,nosuid,size=1g
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    depends_on: [searxng]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: graphy-local-search-secret
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  graphy-data:
  graphy-workspace:
