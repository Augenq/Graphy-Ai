<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Graphy — учебный агент: занятия, практика и учебные курсы." />
    <title>Graphy</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("graphy-material-settings-v1") || "null");
        var t = s && s.theme;
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        if (s && s.font === "serif") document.documentElement.dataset.font = "serif";
        if (s && s.motion === "off") document.documentElement.dataset.motion = "off";
      } catch (e) {}
    </script>
    <style>
      :root { --ui-scale: 1.1; }
      html { font-size: 16px; zoom: var(--ui-scale); height: 100%; margin: 0; }
      body { height: 100%; margin: 0; background: #fafafa; color: #141414; font-family: Roboto, system-ui, sans-serif; overflow: hidden; }
      html[data-theme="dark"] body { background: #151515; color: #f0f0f0; }
      #root { height: 100%; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: inherit; }
      .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .boot-viz { width: 180px; height: 180px; }
      .boot-viz svg { width: 100%; height: 100%; overflow: visible; display: block; }
      .boot-label { margin: 0; font: 500 14px/20px Roboto, system-ui, sans-serif; color: #626262; }
      html[data-theme="dark"] .boot-label { color: #979797; }
      .bl { --ink: #1f1f1f; --mid: rgba(31,31,31,.28); --soft: rgba(31,31,31,.1); --glow: rgba(31,31,31,.18); }
      html[data-theme="dark"] .bl { --ink: #e0e0e0; --mid: rgba(224,224,224,.26); --soft: rgba(224,224,224,.09); --glow: rgba(224,224,224,.16); }
      .bl .orb { fill: none; stroke: var(--soft); stroke-width: 1; }
      .bl .orb-a { stroke: var(--mid); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 10 28 4 40; transform-origin: 90px 90px; animation: b-spin 7s linear infinite; }
      .bl .orb-b { stroke-dasharray: 3 11; transform-origin: 90px 90px; animation: b-spin-r 11s linear infinite; }
      .bl .link { stroke: var(--mid); stroke-width: 1.2; stroke-linecap: round; opacity: 0; animation: b-link 2.4s ease-in-out infinite; }
      .bl .pulse { fill: none; stroke: var(--ink); stroke-width: 1.5; opacity: 0; transform-origin: 90px 90px; animation: b-wave 2.8s cubic-bezier(.2,.6,.2,1) infinite; }
      .bl .node { fill: var(--ink); transform-box: fill-box; transform-origin: center; animation: b-node 1.8s ease-in-out infinite; }
      .bl .node-h { fill: var(--glow); transform-box: fill-box; transform-origin: center; animation: b-halo 1.8s ease-in-out infinite; }
      .bl .trav { fill: var(--ink); opacity: 0; animation-fill-mode: backwards; }
      .bl .core { fill: var(--ink); transform-box: fill-box; transform-origin: center; animation: b-core 1.6s ease-in-out infinite; }
      .bl .core-r { fill: none; stroke: var(--ink); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: b-core-r 1.6s ease-in-out infinite; }
      @keyframes b-spin { to { transform: rotate(360deg); } }
      @keyframes b-spin-r { to { transform: rotate(-360deg); } }
      @keyframes b-link { 0%,100%{ opacity:.08; } 35%,65%{ opacity:.55; } }
      @keyframes b-wave { 0%{ r:10; opacity:.55; stroke-width:2; } 100%{ r:78; opacity:0; stroke-width:.5; } }
      @keyframes b-node { 0%,100%{ transform: scale(.85); opacity:.45; } 50%{ transform: scale(1.25); opacity:1; } }
      @keyframes b-halo { 0%,100%{ transform: scale(.6); opacity:0; } 50%{ transform: scale(1.9); opacity:.5; } }
      @keyframes b-core { 0%,100%{ transform: scale(.88); } 50%{ transform: scale(1.15); } }
      @keyframes b-core-r { 0%,100%{ transform: scale(.9); opacity:.45; } 50%{ transform: scale(1.45); opacity:0; } }
      .bl .t1 { animation: b-t1 2.6s linear infinite; }
      .bl .t2 { animation: b-t2 3.1s linear infinite; }
      .bl .t3 { animation: b-t3 2.8s linear infinite; }
      @keyframes b-t1 { 0%{ transform:translate(90px,90px); opacity:0 } 10%{ opacity:.9 } 90%{ opacity:.9 } 100%{ transform:translate(90px,24px); opacity:0 } }
      @keyframes b-t2 { 0%{ transform:translate(90px,90px); opacity:0 } 10%{ opacity:.9 } 90%{ opacity:.9 } 100%{ transform:translate(148px,118px); opacity:0 } }
      @keyframes b-t3 { 0%{ transform:translate(90px,90px); opacity:0 } 10%{ opacity:.9 } 90%{ opacity:.9 } 100%{ transform:translate(32px,118px); opacity:0 } }
      @media (prefers-reduced-motion: reduce) {
        .bl .orb-a,.bl .orb-b,.bl .link,.bl .pulse,.bl .node,.bl .node-h,.bl .core,.bl .core-r,.bl .t1,.bl .t2,.bl .t3 { animation: none !important; opacity: .55; }
        .bl .pulse,.bl .t1,.bl .t2,.bl .t3 { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Загрузка">
        <div class="boot-inner">
          <div class="boot-viz bl" aria-hidden="true">
            <svg viewBox="0 0 180 180">
              <circle cx="90" cy="90" r="72" class="orb"/>
              <circle cx="90" cy="90" r="72" class="orb orb-a"/>
              <ellipse cx="90" cy="90" rx="48" ry="72" class="orb orb-b"/>
              <circle cx="90" cy="90" r="10" class="pulse" style="animation-delay:0s"/>
              <circle cx="90" cy="90" r="10" class="pulse" style="animation-delay:.93s"/>
              <circle cx="90" cy="90" r="10" class="pulse" style="animation-delay:1.86s"/>
              <line x1="90" y1="90" x2="90" y2="24" class="link" style="animation-delay:0s"/>
              <line x1="90" y1="90" x2="148" y2="58" class="link" style="animation-delay:.2s"/>
              <line x1="90" y1="90" x2="148" y2="118" class="link" style="animation-delay:.4s"/>
              <line x1="90" y1="90" x2="90" y2="156" class="link" style="animation-delay:.6s"/>
              <line x1="90" y1="90" x2="32" y2="118" class="link" style="animation-delay:.8s"/>
              <line x1="90" y1="90" x2="32" y2="58" class="link" style="animation-delay:1s"/>
              <line x1="90" y1="24" x2="148" y2="58" class="link" style="animation-delay:.3s"/>
              <line x1="148" y1="58" x2="148" y2="118" class="link" style="animation-delay:.5s"/>
              <line x1="148" y1="118" x2="90" y2="156" class="link" style="animation-delay:.7s"/>
              <line x1="90" y1="156" x2="32" y2="118" class="link" style="animation-delay:.9s"/>
              <line x1="32" y1="118" x2="32" y2="58" class="link" style="animation-delay:1.1s"/>
              <line x1="32" y1="58" x2="90" y2="24" class="link" style="animation-delay:1.3s"/>
              <circle cx="0" cy="0" r="2.6" class="trav t1"/>
              <circle cx="0" cy="0" r="2.6" class="trav t2" style="animation-delay:.86s"/>
              <circle cx="0" cy="0" r="2.6" class="trav t3" style="animation-delay:1.72s"/>
              <circle cx="90" cy="24" r="9" class="node-h"/><circle cx="90" cy="24" r="4.4" class="node"/>
              <circle cx="148" cy="58" r="8" class="node-h" style="animation-delay:.2s"/><circle cx="148" cy="58" r="3.8" class="node" style="animation-delay:.2s"/>
              <circle cx="148" cy="118" r="8.5" class="node-h" style="animation-delay:.4s"/><circle cx="148" cy="118" r="4.1" class="node" style="animation-delay:.4s"/>
              <circle cx="90" cy="156" r="8" class="node-h" style="animation-delay:.6s"/><circle cx="90" cy="156" r="3.8" class="node" style="animation-delay:.6s"/>
              <circle cx="32" cy="118" r="8.5" class="node-h" style="animation-delay:.8s"/><circle cx="32" cy="118" r="4.1" class="node" style="animation-delay:.8s"/>
              <circle cx="32" cy="58" r="8" class="node-h" style="animation-delay:1s"/><circle cx="32" cy="58" r="3.8" class="node" style="animation-delay:1s"/>
              <circle cx="90" cy="90" r="13" class="core-r"/>
              <circle cx="90" cy="90" r="7.5" class="core"/>
            </svg>
          </div>
          <p class="boot-label">Запускаю Graphy…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
