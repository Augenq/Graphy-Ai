[package]
name = "graphy-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Graphy agent decision and context core, with a versioned JSON C ABI"

[lib]
name = "graphy_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "preserve_order"] }
regex = "=1.12.2"
sha2 = "=0.10.9"

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
fs2 = "0.4"
base64 = "0.22"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.33"
async-stream = "0.3"
scraper = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
glob = "0.3"
unicode-normalization = "0.1"

tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
