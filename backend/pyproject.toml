[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "graphy-agent"
version = "0.3.0"
description = "A learning agent with lessons, questions and practice; serves a local API to the web interface"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
graphy = "graphy.__main__:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "pillow>=11,<13", "jsonschema>=4.23,<5", "filelock>=3.16,<4", "aiohttp>=3.10,<4", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "mypy>=1.15,<3", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["graphy"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
exclude = ["/graphy/_native/**"]
include = ["/rust/Cargo.toml", "/rust/Cargo.lock", "/rust/src", "/rust/include", "/rust/README.md", "/hatch_build.py", "/graphy", "/tests", "/scripts", "/docs", "/*.md", "/pyproject.toml", "/requirements.lock", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["graphy"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
